name: Update se-sshctl

on:
  repository_dispatch:
    types: [se-sshctl-release]

permissions:
  contents: read

jobs:
  update-formula:
    if: github.event.client_payload.repository == 'ajchemist/se-sshctl'
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.client_payload.tag }}
      RELEASE_COMMIT: ${{ github.event.client_payload.commit }}
      FORMULA_LICENSE: ${{ github.event.client_payload.license }}
    steps:
      - name: Create scoped tap token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.HOMEBREW_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: ajchemist
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Validate release event
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$FORMULA_LICENSE" =~ ^[A-Za-z0-9.+-]+$ ]]
          curl --fail --silent --show-error --location \
            "https://api.github.com/repos/ajchemist/se-sshctl/releases/tags/$TAG" >/dev/null

      - name: Generate Formula from immutable tag
        run: |
          archive_url="https://github.com/ajchemist/se-sshctl/archive/refs/tags/$TAG.tar.gz"
          sha256=$(curl --fail --silent --show-error --location --retry 3 "$archive_url" | shasum -a 256 | awk '{print $1}')
          version=${TAG#v}
          branch="automation/se-sshctl-$version"
          git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch" || true
          git checkout -B "$branch"
          cat > se-sshctl.rb <<FORMULA
          require "json"

          class SeSshctl < Formula
            desc "Inspect Apple's CryptoTokenKit-backed SSH path"
            homepage "https://github.com/ajchemist/se-sshctl"
            url "$archive_url"
            sha256 "$sha256"
            license "$FORMULA_LICENSE"

            depends_on macos: :tahoe

            def install
              system "swift", "build", "--configuration", "release", "--disable-sandbox"
              bin.install ".build/release/se-sshctl"
            end

            test do
              report = JSON.parse(shell_output("#{bin}/se-sshctl doctor --json"))
              assert_equal 1, report.fetch("schemaVersion")
            end
          end
          FORMULA
          echo "branch=$branch" >> "$GITHUB_ENV"

      - name: Open bottle update PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "se-sshctl-release[bot]"
          git config user.email "se-sshctl-release[bot]@users.noreply.github.com"
          git add se-sshctl.rb
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "se-sshctl ${TAG#v}"
          git push --force-with-lease origin "$branch"
          pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')
          if [[ -z "$pr" ]]; then
            pr_url=$(gh pr create \
              --base master \
              --head "$branch" \
              --title "se-sshctl ${TAG#v}" \
              --body "Automated Formula update for ajchemist/se-sshctl@$TAG ($RELEASE_COMMIT).")
            pr=${pr_url##*/}
          fi
