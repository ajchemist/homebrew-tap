name: Update se-sshctl

on:
  repository_dispatch:
    types: [se-sshctl-release]

permissions:
  contents: read

jobs:
  update-formula:
    if: github.event.client_payload.repository == 'ajchemist/se-sshctl'
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.client_payload.tag }}
      RELEASE_COMMIT: ${{ github.event.client_payload.commit }}
      FORMULA_LICENSE: ${{ github.event.client_payload.license }}
      ASSET: ${{ github.event.client_payload.asset }}
      ASSET_URL: ${{ github.event.client_payload.asset_url }}
    steps:
      - name: Create scoped tap token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.HOMEBREW_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: ajchemist
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Validate release event
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$FORMULA_LICENSE" =~ ^[A-Za-z0-9.+-]+$ ]]
          [[ "$ASSET" == "se-sshctl-${TAG#v}-macos-universal.tar.gz" ]]
          [[ "$ASSET_URL" == "https://github.com/ajchemist/se-sshctl/releases/download/$TAG/$ASSET" ]]
          gh api "repos/ajchemist/se-sshctl/releases/tags/$TAG" >/dev/null

      - name: Verify release asset against SHA256SUMS
        run: |
          curl --fail --silent --show-error --location --retry 3 --remote-name "$ASSET_URL"
          curl --fail --silent --show-error --location --retry 3 --remote-name "${ASSET_URL%/*}/SHA256SUMS"
          sha256=$(awk -v f="$ASSET" '$2 == f { print $1 }' SHA256SUMS)
          [[ "$sha256" =~ ^[0-9a-f]{64}$ ]]
          echo "$sha256  $ASSET" | shasum -a 256 --check
          tar -tzf "$ASSET" | grep -qx 'se-sshctl'
          rm "$ASSET" SHA256SUMS
          echo "sha256=$sha256" >> "$GITHUB_ENV"

      - name: Generate Formula from release asset
        run: |
          version=${TAG#v}
          branch="automation/se-sshctl-$version"
          git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch" || true
          git checkout -B "$branch"
          cat > se-sshctl.rb <<FORMULA
          require "json"

          class SeSshctl < Formula
            desc "Inspect Apple's CryptoTokenKit-backed SSH path"
            homepage "https://github.com/ajchemist/se-sshctl"
            url "$ASSET_URL"
            sha256 "$sha256"
            license "$FORMULA_LICENSE"

            depends_on macos: :tahoe

            def install
              bin.install "se-sshctl"
            end

            test do
              assert_equal "se-sshctl #{version}", shell_output("#{bin}/se-sshctl --version").strip

              report = JSON.parse(shell_output("#{bin}/se-sshctl doctor --json"))
              assert_equal version.to_s, report.fetch("seSSHCTL")
              assert_operator report.fetch("schemaVersion"), :>=, 1
            end
          end
          FORMULA
          echo "branch=$branch" >> "$GITHUB_ENV"

      - name: Open Formula update PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "se-sshctl-release[bot]"
          git config user.email "se-sshctl-release[bot]@users.noreply.github.com"
          git add se-sshctl.rb
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "se-sshctl ${TAG#v}"
          git push --force-with-lease origin "$branch"
          pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')
          if [[ -z "$pr" ]]; then
            pr_url=$(gh pr create \
              --base master \
              --head "$branch" \
              --title "se-sshctl ${TAG#v}" \
              --body "Automated Formula update for ajchemist/se-sshctl@$TAG ($RELEASE_COMMIT).")
            pr=${pr_url##*/}
          fi
