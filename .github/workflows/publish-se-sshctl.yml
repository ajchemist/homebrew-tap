name: Merge se-sshctl update

on:
  workflow_run:
    workflows: [Test se-sshctl Formula]
    types: [completed]

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'automation/se-sshctl-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge tested PR commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PULL_REQUEST: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: gh pr merge --rebase --delete-branch --match-head-commit "$HEAD_SHA" "$PULL_REQUEST"
